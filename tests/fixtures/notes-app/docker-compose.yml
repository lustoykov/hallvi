# Local development only: throwaway credentials and host-published ports.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: notes
      POSTGRES_PASSWORD: notes-dev-only
      POSTGRES_DB: notes
    ports: ["5432:5432"]
    volumes: ["./pgdata:/var/lib/postgresql/data"]
  web:
    build: .
    ports: ["8080:8080"]
    environment:
      DATABASE_URL: postgresql://notes:notes-dev-only@db:5432/notes
      APP_SECRET: dev-only-signing-key
    depends_on: [db]
  worker:
    build: .
    command: ["python", "worker.py"]
    environment:
      DATABASE_URL: postgresql://notes:notes-dev-only@db:5432/notes
    depends_on: [db]
