# Local development only: throwaway credentials and host-published ports.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: shop
      POSTGRES_PASSWORD: shop-dev-only
      POSTGRES_DB: shop
    ports: ["5432:5432"]
  cache:
    image: redis:7
    ports: ["6379:6379"]
  web:
    build: .
    ports: ["8000:8000"]
    environment:
      DATABASE_URL: postgresql://shop:shop-dev-only@db:5432/shop
      REDIS_URL: redis://cache:6379/0
      SHOP_CURRENCY: EUR
      SHOP_ADMIN_PASSWORD: dev-only-not-a-real-password
    volumes: ["receipts:/var/lib/shop/receipts"]
    depends_on: [db, cache]
  worker:
    build: .
    command: ["python", "worker.py"]
    environment:
      DATABASE_URL: postgresql://shop:shop-dev-only@db:5432/shop
      REDIS_URL: redis://cache:6379/0
      SHOP_CURRENCY: EUR
    volumes: ["receipts:/var/lib/shop/receipts"]
    depends_on: [db, cache]
volumes:
  receipts:
