<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Server Guy · Application Launch journey</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --paper: #f5f5f5;
      --paper-2: #ececec;
      --ink: #2d3142;
      --muted: #4f5d75;
      --soft: #7a8399;
      --rule: rgba(45, 49, 66, 0.12);
      --rule-strong: rgba(45, 49, 66, 0.24);
      --accent: #eb6c36;
      --accent-tint: rgba(235, 108, 54, 0.08);
      --link: #2e5aa8;
      --sans: 'Geist', system-ui, sans-serif;
      --serif: 'Instrument Serif', serif;
      --mono: 'Geist Mono', ui-monospace, monospace;
    }
    body {
      background: var(--paper);
      color: var(--ink);
      font-family: var(--sans);
      min-height: 100vh;
      padding: 48px 32px 80px;
    }
    main { margin: 0 auto; max-width: 1280px; }
    header { margin-bottom: 48px; max-width: 760px; }
    .eyebrow {
      color: var(--muted);
      font-family: var(--mono);
      font-size: 8px;
      font-weight: 500;
      letter-spacing: 0.18em;
      margin-bottom: 8px;
      text-transform: uppercase;
    }
    h1, h2 {
      color: var(--ink);
      font-family: var(--serif);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.1;
    }
    h1 { font-size: 40px; margin-bottom: 12px; }
    h2 { font-size: 28px; margin-bottom: 20px; }
    .lede { color: var(--muted); font-size: 16px; line-height: 1.6; }
    figure { margin-top: 64px; }
    .diagram-shell { overflow-x: auto; padding-bottom: 8px; }
    svg { display: block; min-width: 1100px; width: 100%; }
    figcaption {
      color: var(--muted);
      font-size: 12px;
      line-height: 1.6;
      margin-top: 16px;
      max-width: 880px;
    }
  </style>
</head>
<body>
  <main>
    <header>
      <p class="eyebrow">Journey 01 · Application Launch</p>
      <h1>From repository to an externally verified application</h1>
      <p class="lede">The engineer collaborates with Pi, but Server Guy preserves the durable operational record. The phases make the experience understandable without imposing a fixed reasoning pipeline on Pi.</p>
    </header>
