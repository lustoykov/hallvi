<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Hallvi</title>
<style>
  /* Hallvi's tokens, over the host's own surface, text and type when it shares them. */
  :root {
    color-scheme: light;
    --surface: var(--color-background-primary, #ffffff);
    --raised: var(--color-background-secondary, #fbfcfe);
    --sunken: var(--color-background-tertiary, #f4f6fa);
    --ink: var(--color-text-primary, #202838);
    --muted: var(--color-text-secondary, #687183);
    --line: var(--color-border-secondary, #e7e9ee);
    --field-line: var(--color-border-primary, #ccd5e3);
    --blue: #285ad8; --blue-hover: #2350c4; --blue-ink: #ffffff;
    --working-bg: #edf3ff; --working-text: #2852a6; --working-line: #c7d6f5;
    --waiting-bg: #fff4e9; --waiting-text: #9a4b10; --waiting-line: #ecd6b8; --waiting-surface: #fffdfa;
    --verified: #14945f; --verified-bg: #eaf8f1; --verified-text: #0f7a4e;
    --failed: #a6312b; --failed-bg: #fdf1f0; --failed-line: #f2d3d0;
    --unknown-bg: #eef1f6;
    --ask-bg: #eef2f9;
    --shade: 28 52 110;
    --sans: var(--font-sans, "Geist", system-ui, -apple-system, "Segoe UI", sans-serif);
    --mono: var(--font-mono, "Geist Mono", ui-monospace, SFMono-Regular, Menlo, monospace);
    --fast: 120ms; --base: 200ms;
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --surface: var(--color-background-primary, #1d2027);
    --raised: var(--color-background-secondary, #252932);
    --sunken: var(--color-background-tertiary, #181b21);
    --ink: var(--color-text-primary, #e6eaf2);
    --muted: var(--color-text-secondary, #a3adbf);
    --line: var(--color-border-secondary, #343a46);
    --field-line: var(--color-border-primary, #454d5c);
    --blue: #6f95f5; --blue-hover: #86a6f7; --blue-ink: #0d1424;
    --working-bg: #1f2b45; --working-text: #9fbaff; --working-line: #34467a;
    --waiting-bg: #3a2a1a; --waiting-text: #f0bc86; --waiting-line: #5f4428; --waiting-surface: #2b241d;
    --verified: #4cc38a; --verified-bg: #16301f; --verified-text: #7fd8a8;
    --failed: #ff9d95; --failed-bg: #3a1f1e; --failed-line: #5c2d2a;
    --unknown-bg: #2c313b;
    --ask-bg: #2a2f3a;
    --shade: 0 0 0;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--surface); color: var(--ink); font: 13.5px/1.6 var(--sans); -webkit-font-smoothing: antialiased; }
  button, select, textarea, input { font: inherit; color: inherit; }
  button { cursor: pointer; }
  :focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; border-radius: 6px; }
  [hidden] { display: none !important; }
  a { color: var(--blue); text-underline-offset: 3px; }
  .muted { color: var(--muted); }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  .icon { display: inline-flex; flex: none; }
  .icon svg { display: block; }

  /* A compact Hallvi: wider frames centre it rather than stretch it. */
  #app { position: relative; display: flex; flex-direction: column; height: 100vh; max-width: 640px; margin: 0 auto; }
  :root[data-mode="inline"] #app { height: min(640px, 100vh); }

  /* Which application, and the way into Hallvi. */
  .top { display: flex; align-items: center; gap: 6px; padding: 10px 12px 8px; }
  .identity { flex: 1; min-width: 0; display: flex; flex-direction: column; align-items: flex-start; }
  .who { position: relative; display: flex; align-items: center; gap: 8px; min-width: 0; max-width: 100%; border-radius: 8px; padding: 3px 6px 3px 3px; }
  .address-link { max-width: calc(100% - 35px); margin: -4px 0 0 35px; font-size: 11.5px; color: var(--muted); text-decoration: none; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .address-link:hover { color: var(--blue); text-decoration: underline; }
  .who:hover { background: var(--sunken); }
  .who:focus-within { outline: 2px solid var(--blue); outline-offset: 1px; }
  .who select { position: absolute; inset: 0; opacity: 0; width: 100%; cursor: pointer; }
  .who select:disabled { cursor: default; }
  .avatar { flex: none; width: 24px; height: 24px; border-radius: 7px; display: grid; place-items: center; font-weight: 650; font-size: 12px; color: #fff; background: #7a8bd6; }
  .name { font-weight: 620; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .chev { flex: none; color: var(--muted); }
  .open-hallvi { flex: none; display: inline-flex; align-items: center; gap: 4px; height: 26px; padding: 0 9px 0 10px; border: 1px solid var(--line); border-radius: 999px; background: var(--surface); color: var(--working-text); font-size: 12px; font-weight: 560; transition: background var(--fast); }
  .open-hallvi:hover { background: var(--working-bg); border-color: var(--working-line); }
  .icon-button { flex: none; width: 28px; height: 28px; display: grid; place-items: center; border: 0; border-radius: 7px; background: transparent; color: var(--muted); }
  .icon-button:hover { background: var(--sunken); color: var(--ink); }

  /* Two views of one application, the selected one raised off the track. */
  .tabs { display: flex; gap: 2px; margin: 0 12px 8px; padding: 3px; border-radius: 10px; background: var(--sunken); }
  .tab { position: relative; flex: 1 1 0; min-width: 0; display: inline-flex; align-items: center; justify-content: center; gap: 6px; height: 28px; padding: 0 8px; border: 0; border-radius: 8px; background: transparent; color: var(--muted); font-size: 12.5px; font-weight: 560; white-space: nowrap; transition: color var(--fast), background var(--fast); }
  .tab:hover { color: var(--ink); }
  .tab[aria-selected="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 0 0 1px rgb(var(--shade) / .07), 0 1px 3px rgb(var(--shade) / .13); }
  /* In the dark, what is raised is lighter than its track. */
  :root[data-theme="dark"] .tab[aria-selected="true"] { background: rgb(255 255 255 / .1); box-shadow: 0 0 0 1px rgb(255 255 255 / .06), 0 1px 3px rgb(0 0 0 / .45); }
  .tab-state { display: inline-flex; align-items: center; gap: 5px; min-width: 0; overflow: hidden; font-size: 11.5px; font-weight: 600; }
  .tab-state.working { color: var(--working-text); }
  .tab-state.waiting { color: var(--waiting-text); }
  .tab-state.unknown { color: var(--muted); }
  .tab-state.fresh { color: var(--blue); }
  .tab-state .words { overflow: hidden; text-overflow: ellipsis; }
  @media (max-width: 359px) { .tab-state .words { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); } }

  .spinner { width: 10px; height: 10px; border-radius: 50%; border: 1.5px solid currentColor; border-right-color: transparent; animation: spin 0.9s linear infinite; flex: none; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .dot { flex: none; width: 7px; height: 7px; border-radius: 50%; background: var(--muted); opacity: .7; }
  .pulse { flex: none; width: 6px; height: 6px; border-radius: 50%; background: currentColor; animation: pulse 1.6s ease-in-out infinite; }
  @keyframes pulse { 50% { opacity: .35; } }
  .dot.live { background: var(--verified); opacity: 1; }
  .dot.warn { background: #b25a16; opacity: 1; }
  .dot.bad { background: var(--failed); opacity: 1; }

  .views { position: relative; flex: 1; min-height: 0; display: flex; flex-direction: column; }
  .notice { display: flex; gap: 8px; align-items: flex-start; margin: 0 12px 8px; padding: 8px 10px; border-radius: 8px; background: var(--unknown-bg); font-size: 12.5px; }
  .notice p { margin: 0; flex: 1; }

  /* Overview: one row per part of the application, marked as Hallvi's sidebar
     marks it, with its time at the right edge and the way to it. */
  .overview { flex: 1; min-height: 0; overflow-y: auto; overscroll-behavior: contain; padding: 0 16px 16px; }
  .item { display: grid; grid-template-columns: 16px minmax(0, 1fr) auto; column-gap: 10px; align-items: baseline; padding: 11px 0; border-top: 1px solid var(--line); }
  .item:first-child { border-top: 0; padding-top: 4px; }
  .item > .glyph { align-self: start; display: grid; place-items: center; width: 16px; height: 20px; color: var(--muted); }
  .item > .glyph svg { width: 16px; height: 16px; }
  .item > .glyph .mark { width: 16px; height: 15px; }
  .item.lead > .glyph { height: 21px; }
  .item > .main { min-width: 0; }
  .item > .side { display: inline-flex; align-items: center; gap: 2px; font-size: 11.5px; color: var(--muted); white-space: nowrap; font-variant-numeric: tabular-nums; }
  .item > .more { grid-column: 2 / 4; min-width: 0; }
  .primary { margin: 0; overflow-wrap: anywhere; }
  .primary code { font: 12.5px var(--mono); }
  .item.lead .primary { font-size: 15px; font-weight: 620; line-height: 1.4; }
  .primary.failed, .sub.failed { color: var(--failed); }
  .primary.needs { color: var(--waiting-text); font-weight: 600; }
  .primary.quiet { color: var(--muted); }
  .sub { margin: 1px 0 0; color: var(--muted); font-size: 12.5px; overflow-wrap: anywhere; }
  .sub.one { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .out { display: inline-grid; place-items: center; width: 22px; height: 22px; margin-right: -4px; border: 0; border-radius: 6px; background: none; color: var(--muted); }
  .out:hover { color: var(--blue); background: var(--sunken); }
  .pill { display: inline-block; padding: 0 7px; border-radius: 999px; background: var(--unknown-bg); font-size: 11.5px; line-height: 1.6; }
  .asks { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  .ask { display: inline-flex; align-items: center; gap: 4px; border: 1px solid var(--line); border-radius: 999px; padding: 2px 10px; background: var(--surface); color: var(--working-text); font-size: 12px; transition: background var(--fast); }
  .ask:hover { background: var(--working-bg); border-color: var(--working-line); }
  .figures { margin: 0; }
  .figures .figure { white-space: nowrap; }
  .figures b { font-weight: 650; font-variant-numeric: tabular-nums; }
  .figures .bad { color: var(--failed); }
  .bars { display: flex; align-items: flex-end; gap: 2px; height: 26px; margin-top: 8px; }
  .bars i { flex: 1; min-height: 2px; border-radius: 2px 2px 0 0; background: var(--working-line); }
  .bars i.error { background: var(--failed); opacity: .75; }
  .bars i.gap { background: repeating-linear-gradient(135deg, var(--line) 0 2px, transparent 2px 4px); height: 100% !important; opacity: .8; }
  .gap-key { display: flex; align-items: center; gap: 4px; margin-top: 3px; font-size: 10.5px; color: var(--muted); }
  .gap-key i { width: 8px; height: 8px; border-radius: 1px; background: repeating-linear-gradient(135deg, var(--muted) 0 1px, transparent 1px 3px); opacity: .7; }
  .problems { list-style: none; margin: 6px 0 0; padding: 0; font-size: 12.5px; }
  .problems li { display: flex; gap: 8px; padding: 1px 0; }
  .problems li > code { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font: 11.5px/1.6 var(--mono); }
  .problems .n { color: var(--failed); font-variant-numeric: tabular-nums; font-weight: 600; }
  .item .secondary { margin-top: 8px; }

  /* The conversation with the main operator. */
  .operator { flex: 1; min-height: 0; display: flex; flex-direction: column; }
  .thread { flex: 1; min-height: 0; overflow-y: auto; padding: 4px 12px 16px; overscroll-behavior: contain; }
  .banner { display: flex; gap: 8px; align-items: flex-start; margin: 6px 0 10px; padding: 8px 10px; border-radius: 8px; background: var(--unknown-bg); font-size: 12.5px; }
  .banner p { margin: 0; flex: 1; }
  .earlier { display: block; margin: 4px 0 10px; font-size: 12px; color: var(--muted); text-align: center; }
  .turn { margin: 0 0 18px; }
  .ask-turn { display: flex; flex-direction: column; align-items: flex-end; margin: 0 0 10px; }
  .ask-turn p { margin: 0; max-width: 88%; padding: 7px 11px; border-radius: 12px 12px 4px 12px; background: var(--ask-bg); white-space: pre-wrap; overflow-wrap: anywhere; }
  .ask-turn small { margin-top: 3px; font-size: 11px; color: var(--muted); }
  .ask-turn.waiting p { background: transparent; border: 1px dashed var(--field-line); }
  .ask-turn.failed p { background: var(--failed-bg); }
  .reply { min-width: 0; }
  .byline { display: flex; align-items: center; gap: 6px; margin-bottom: 4px; font-size: 11.5px; color: var(--muted); }
  .byline b { color: var(--ink); font-weight: 620; }
  .mark { width: 16px; height: 15px; flex: none; }
  .body { overflow-wrap: anywhere; }
  .body p { margin: 0 0 8px; }
  .body ul, .body ol { margin: 0 0 8px; padding-left: 20px; }
  .body li { margin: 2px 0; }
  .body code { font: 12px/1.5 var(--mono); padding: 0 4px; border-radius: 4px; background: var(--sunken); }
  .body pre { margin: 0 0 8px; padding: 8px 10px; border-radius: 8px; background: var(--sunken); overflow-x: auto; font: 12px/1.5 var(--mono); white-space: pre; }
  .body pre code { padding: 0; background: none; }
  .body h4 { margin: 10px 0 4px; font-size: 13.5px; }
  .body.folded { max-height: 15.5em; overflow: hidden; -webkit-mask-image: linear-gradient(#000 70%, transparent); mask-image: linear-gradient(#000 70%, transparent); }
  .text-button { border: 0; padding: 0; background: none; color: var(--blue); font-size: 12px; }
  .text-button:hover { text-decoration: underline; text-underline-offset: 3px; }
  .text-button.quiet { color: var(--muted); }
  .text-button.quiet:hover { color: var(--ink); }
  .actions { display: flex; flex-wrap: wrap; gap: 4px 14px; margin-top: 4px; }

  /* What a reply did: one line, opened on request. */
  .work { margin: 2px 0 8px; font-size: 12.5px; }
  .work > summary { display: inline-flex; align-items: center; gap: 6px; cursor: pointer; color: var(--muted); list-style: none; border-radius: 6px; padding: 1px 4px 1px 0; }
  .work > summary::-webkit-details-marker { display: none; }
  .work > summary:hover { color: var(--ink); }
  .work > summary svg { transition: transform var(--base); }
  .work[open] > summary svg { transform: rotate(90deg); }
  .steps { list-style: none; margin: 6px 0 2px; padding: 0 0 0 10px; border-left: 1px solid var(--line); }
  .steps > li { margin: 0 0 4px; }
  .said { margin: 6px 0; color: var(--ink); white-space: pre-wrap; overflow-wrap: anywhere; }
  .step > summary { display: flex; gap: 7px; align-items: baseline; cursor: pointer; list-style: none; }
  .step > summary::-webkit-details-marker { display: none; }
  .step .glyph { flex: none; width: 12px; text-align: center; color: var(--muted); font-size: 11px; }
  .step .glyph.failed { color: var(--failed); }
  .step .glyph.running { color: var(--working-text); }
  .step .what { flex: 1; min-width: 0; }
  .step .where { color: var(--muted); }
  .step pre { margin: 5px 0 6px 19px; padding: 7px 9px; border-radius: 7px; background: var(--sunken); font: 11.5px/1.5 var(--mono); white-space: pre-wrap; overflow-wrap: anywhere; max-height: 220px; overflow: auto; }
  .step .note { margin: 0 0 4px 19px; font-size: 11.5px; color: var(--muted); }

  /* Now: under the reply it belongs to, and on the overview. */
  .live { display: flex; align-items: center; gap: 7px; margin: 6px 0 2px; color: var(--working-text); font-size: 12.5px; }
  .live .says { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .live .since { flex: none; color: var(--muted); font-variant-numeric: tabular-nums; }
  .live.stale { color: var(--muted); }
  .tailing { margin: 4px 0 0 17px; padding: 6px 8px; border-radius: 7px; background: var(--sunken); font: 11px/1.5 var(--mono); color: var(--muted); white-space: pre-wrap; overflow-wrap: anywhere; max-height: 7.5em; overflow: hidden; }

  .card { margin: 8px 0; padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--raised); font-size: 12.5px; }
  .card.waiting { border-color: var(--waiting-line); background: var(--waiting-surface); }
  .card.failed { border-color: var(--failed-line); }
  .card h4 { display: flex; align-items: center; gap: 6px; margin: 0 0 4px; font-size: 12.5px; font-weight: 620; }
  .card.waiting h4 { color: var(--waiting-text); }
  .card p { margin: 3px 0; }
  .card code { font: 11.5px/1.5 var(--mono); padding: 0 3px; border-radius: 4px; background: var(--sunken); }
  .card code.command { display: block; margin: 6px 0; padding: 6px 8px; border-radius: 6px; background: var(--sunken); font: 11.5px/1.5 var(--mono); white-space: pre-wrap; overflow-wrap: anywhere; max-height: 6em; overflow: hidden; }
  .card .secondary { margin-top: 4px; }
  .record { display: flex; gap: 8px; align-items: baseline; margin: 6px 0; padding: 7px 10px; border: 1px solid var(--line); border-radius: 10px; font-size: 12.5px; }
  .record .title { flex: 1; min-width: 0; }
  .record .meta { flex: none; color: var(--muted); font-size: 11.5px; }
  .tag { flex: none; font-size: 11px; font-weight: 600; }
  .tag.verified { color: var(--verified-text); }
  .tag.failed { color: var(--failed); }
  .tag.warning { color: var(--waiting-text); }
  .tag.info { color: var(--muted); }

  .empty { margin: 24px auto; max-width: 34ch; text-align: center; color: var(--muted); }
  .empty svg { width: 44px; height: 40px; }
  .empty h2 { margin: 8px 0 4px; font-size: 15px; color: var(--ink); font-weight: 620; overflow-wrap: anywhere; }
  .empty p { margin: 0 0 12px; }
  .suggestions { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; }
  .suggestions button { border: 1px solid var(--line); border-radius: 999px; padding: 3px 10px; background: var(--surface); font-size: 12px; }
  .suggestions button:hover { background: var(--working-bg); color: var(--working-text); border-color: var(--working-line); }

  /* Ask, follow up. */
  .composer { padding: 8px 12px 10px; border-top: 1px solid var(--line); background: var(--surface); }
  .needs { margin: 0 0 8px; }
  .needs .card { margin: 0; }
  .field { border: 1px solid var(--field-line); border-radius: 12px; background: var(--surface); padding: 8px 8px 6px 11px; transition: border-color var(--fast); box-shadow: 0 1px 3px rgb(var(--shade) / .06); }
  .field:focus-within { border-color: var(--blue); }
  .field:has(textarea:disabled) { background: var(--sunken); }
  .field textarea { display: block; width: 100%; min-height: 1.5em; border: 0; outline: 0; resize: none; background: transparent; line-height: 1.5; max-height: 9em; padding: 0; }
  .field textarea::placeholder { color: var(--muted); opacity: .8; }
  .field-row { display: flex; align-items: center; gap: 8px; margin-top: 4px; }
  .field-row .hint { flex: 1; min-width: 0; font-size: 11.5px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .send { flex: none; display: inline-flex; align-items: center; gap: 6px; height: 28px; padding: 0 11px; border: 0; border-radius: 8px; background: var(--blue); color: var(--blue-ink); font-size: 12.5px; font-weight: 560; box-shadow: inset 0 1px 0 rgb(255 255 255 / .18), 0 1px 2px rgb(var(--shade) / .2); }
  .send:hover { background: var(--blue-hover); }
  .send:disabled { opacity: .45; cursor: default; box-shadow: none; }
  .sending-note { margin: 6px 2px 0; font-size: 12px; }
  .sending-note.failed { color: var(--failed); }

  .popover { position: absolute; left: 12px; right: 12px; top: 0; z-index: 6; padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); box-shadow: 0 8px 24px rgb(var(--shade) / .14); font-size: 12.5px; }
  .popover p { margin: 0 0 6px; }
  .popover .what { font-weight: 620; }
  .menu { position: absolute; right: 12px; top: 42px; z-index: 7; min-width: 210px; padding: 4px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); box-shadow: 0 8px 24px rgb(var(--shade) / .14); }
  .menu button, .menu .item { display: block; width: 100%; padding: 6px 10px; border: 0; border-radius: 7px; background: none; text-align: left; font-size: 12.5px; }
  .menu button:hover, .menu button:focus-visible { background: var(--sunken); }
  .panel-update { flex: none; margin: 0 12px 8px; padding: 10px 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--raised); font-size: 12.5px; overflow-wrap: anywhere; }
  .panel-update p { margin: 0 0 6px; }
  .panel-update .actions { display: flex; flex-wrap: wrap; gap: 8px; }
  button:disabled { cursor: default; opacity: .6; }
  .menu hr { border: 0; border-top: 1px solid var(--line); margin: 4px 2px; }
  .menu .item { color: var(--muted); font-size: 11.5px; cursor: default; }
  .address { display: flex; gap: 6px; margin-top: 6px; }
  .address input { flex: 1; min-width: 0; border: 1px solid var(--field-line); border-radius: 7px; padding: 3px 7px; background: var(--surface); font-size: 12px; }
  .address button { flex: none; border: 1px solid var(--field-line); border-radius: 7px; padding: 3px 9px; background: var(--surface); font-size: 12px; }

  .blank { margin: auto; padding: 24px; max-width: 38ch; text-align: center; }
  .blank h2 { font-size: 15px; margin: 8px 0 4px; }
  .blank .mark { width: 40px; height: 38px; }
  .blank p { margin: 0 0 12px; color: var(--muted); }
  .blank-host { flex: 1; display: flex; flex-direction: column; min-height: 0; overflow-y: auto; }
  .secondary { display: inline-flex; align-items: center; gap: 4px; border: 1px solid var(--field-line); border-radius: 8px; padding: 4px 12px; background: var(--surface); font-size: 12.5px; }
  .secondary:hover { background: var(--sunken); }
  .loading { color: var(--muted); }

  @media (prefers-reduced-motion: reduce) {
    .spinner { animation: none; border-right-color: currentColor; opacity: .7; }
    .pulse { animation: none; }
    * { transition: none !important; }
  }
</style>
</head>

$("tabs").addEventListener("keydown", (event) => {
  if (!["ArrowLeft", "ArrowRight", "Home", "End"].includes(event.key)) return;
  event.preventDefault();
  setView(event.key === "Home" ? "overview" : event.key === "End" ? "operator" : state.view === "overview" ? "operator" : "overview", { focus: "tab" });
});
$("open-hallvi").addEventListener("click", () => {
  if (state.view === "overview") void openAddress(pageFor("overview"), { kind: "hallvi", what: "Overview in Hallvi" });
  else void openAddress(pageOf(), { kind: "hallvi", what: "This conversation in Hallvi" });
});
$("composer").addEventListener("submit", send);
$("draft").addEventListener("input", () => { autosize(); saveDraft(); renderComposer(); });
$("draft").addEventListener("keydown", (event) => {
  if (event.key === "Enter" && !event.shiftKey && !event.isComposing) { event.preventDefault(); void send(); }
});
function closeMenu() { $("menu").hidden = true; $("more").setAttribute("aria-expanded", "false"); }
$("more").addEventListener("click", () => {
  const open = $("menu").hidden;
  $("menu").hidden = !open; $("more").setAttribute("aria-expanded", String(open));
  if (open) $("menu").querySelector("button").focus();
});
$("menu").addEventListener("keydown", (event) => {
  const items = [...$("menu").querySelectorAll("button")];
  const i = items.indexOf(document.activeElement);
  if (event.key === "ArrowDown") { event.preventDefault(); items[(i + 1) % items.length].focus(); }
  if (event.key === "ArrowUp") { event.preventDefault(); items[(i - 1 + items.length) % items.length].focus(); }
});
$("menu-refresh").addEventListener("click", () => { closeMenu(); void readContext(); void follow(true); });
// The adapter's resource version and this rendered document are separate facts.
let updateChecking = false;
let availablePanelVersion = null;
function noticePanelVersion(version) {
  if (typeof version !== "string" || !/^[a-f0-9]{16}$/.test(version)) return false;
  availablePanelVersion = version;
  if (version !== $("ui-version").textContent) showPanelUpdate();
  return true;
}
function showPanelUpdate(error = null) {
  const shown = $("ui-version").textContent;
  const different = availablePanelVersion && availablePanelVersion !== shown;
  const title = error ? "Panel update check failed" : different ? "Panel update available" : "This panel matches the installed UI";
  $("panel-update").hidden = false;
  $("panel-update-status").replaceChildren(...[
    el("p", {}, el("strong", {}, title)),
    error ? el("p", {}, error) : null,
    different ? el("p", {}, "Reopen Hallvi; in Codex, use a new chat. If the earlier version remains, reconnect the Hallvi plugin.") : null,
    different && $("draft").value ? el("p", {}, "Copy your unsent message before leaving.") : null,
    availablePanelVersion ? el("p", { class: "muted" }, `Shown: ${shown}. Available: ${availablePanelVersion}.`) : null,
    !different ? el("p", { class: "muted" }, "This checks the panel file only. Adapter code changes require a plugin reconnect.") : null,
  ].filter(Boolean));
}
async function checkPanelUpdate() {
  if (updateChecking) return;
  updateChecking = true;
  closeMenu();
  $("more").focus();
  $("panel-update").hidden = false;
  $("panel-update-status").replaceChildren(el("p", {}, "Checking the installed panel…"));
  $("menu-reload").disabled = $("update-check").disabled = true;
  try {
    const result = await call("hallvi_reload_ui", {}, 15_000);
    if (!noticePanelVersion(result?.version)) throw new Error("The plugin did not return a panel version.");
    showPanelUpdate();
  } catch (error) {
    const detail = error.code === "host-timeout"
      ? "The host did not answer in time. The check may still finish; try again. If it keeps failing, reconnect the Hallvi plugin."
      : `${error.message} Try again; if it keeps failing, reconnect the Hallvi plugin.`;
    showPanelUpdate(detail);
  } finally {
    updateChecking = false;
    $("menu-reload").disabled = $("update-check").disabled = false;
  }
}
$("menu-reload").addEventListener("click", checkPanelUpdate);
$("update-check").addEventListener("click", checkPanelUpdate);
$("update-dismiss").addEventListener("click", () => { $("panel-update").hidden = true; $("more").focus(); });
document.addEventListener("keydown", (event) => {
  if (event.key !== "Escape") return;
  if (!$("menu").hidden) { closeMenu(); $("more").focus(); }
  else if (!$("link-help").hidden) closeAddress();
});
document.addEventListener("click", (event) => {
  if (!$("menu").hidden && !event.target.closest("#menu, #more")) closeMenu();
});

// ---------------------------------------------------------------- start
try {
  if (window.parent === window) throw new Error("Open this panel through the Hallvi plugin in Codex or ChatGPT.");
  const init = await request("ui/initialize", { appInfo: { name: "hallvi", version: VERSION }, appCapabilities: {}, protocolVersion: "2026-01-26" }, 15_000);
  applyHostContext(init?.hostContext);
  post({ method: "ui/notifications/initialized", params: {} });
  host.ready = true;
  await start();
} catch (error) {
  renderBlank("Panel connection unavailable", error.message || "This panel needs an MCP Apps host.");
}
</script>
</body>
</html>
