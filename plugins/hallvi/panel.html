<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Hallvi</title>
<style>
  /* Hallvi's tokens, over the host's own surface, text and type when it shares them. */
  :root {
    color-scheme: light;
    --surface: var(--color-background-primary, #ffffff);
    --raised: var(--color-background-secondary, #fbfcfe);
    --sunken: var(--color-background-tertiary, #f4f6fa);
    --ink: var(--color-text-primary, #202838);
    --muted: var(--color-text-secondary, #687183);
    --line: var(--color-border-secondary, #e7e9ee);
    --field-line: var(--color-border-primary, #ccd5e3);
    --blue: #285ad8; --blue-hover: #2350c4; --blue-ink: #ffffff;
    --working-bg: #edf3ff; --working-text: #2852a6; --working-line: #c7d6f5;
    --waiting-bg: #fff4e9; --waiting-text: #9a4b10; --waiting-line: #ecd6b8; --waiting-surface: #fffdfa;
    --verified: #14945f; --verified-bg: #eaf8f1; --verified-text: #0f7a4e;
    --failed: #a6312b; --failed-bg: #fdf1f0; --failed-line: #f2d3d0;
    --unknown-bg: #eef1f6;
    --ask-bg: #eef2f9;
    --sans: var(--font-sans, "Geist", system-ui, -apple-system, "Segoe UI", sans-serif);
    --mono: var(--font-mono, "Geist Mono", ui-monospace, SFMono-Regular, Menlo, monospace);
    --fast: 120ms; --base: 200ms;
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --surface: var(--color-background-primary, #1d2027);
    --raised: var(--color-background-secondary, #252932);
    --sunken: var(--color-background-tertiary, #181b21);
    --ink: var(--color-text-primary, #e6eaf2);
    --muted: var(--color-text-secondary, #a3adbf);
    --line: var(--color-border-secondary, #343a46);
    --field-line: var(--color-border-primary, #454d5c);
    --blue: #6f95f5; --blue-hover: #86a6f7; --blue-ink: #0d1424;
    --working-bg: #1f2b45; --working-text: #9fbaff; --working-line: #34467a;
    --waiting-bg: #3a2a1a; --waiting-text: #f0bc86; --waiting-line: #5f4428; --waiting-surface: #2b241d;
    --verified: #4cc38a; --verified-bg: #16301f; --verified-text: #7fd8a8;
    --failed: #ff9d95; --failed-bg: #3a1f1e; --failed-line: #5c2d2a;
    --unknown-bg: #2c313b;
    --ask-bg: #2a2f3a;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--surface); color: var(--ink); font: 13.5px/1.6 var(--sans); -webkit-font-smoothing: antialiased; }
  button, select, textarea, input { font: inherit; color: inherit; }
  button { cursor: pointer; }
  :focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; border-radius: 6px; }
  [hidden] { display: none !important; }
  a { color: var(--blue); text-underline-offset: 3px; }
  .muted { color: var(--muted); }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

  #app { position: relative; display: flex; flex-direction: column; height: 100vh; max-width: 820px; margin: 0 auto; }
  :root[data-mode="inline"] #app { height: min(640px, 100vh); }

  /* Which application, and what its operator is doing. */
  .top { display: flex; align-items: center; gap: 8px; padding: 10px 12px 6px; }
  .who { position: relative; display: flex; align-items: center; gap: 8px; min-width: 0; flex: 1; border-radius: 8px; padding: 3px 6px 3px 3px; }
  .who:hover { background: var(--sunken); }
  .who:focus-within { outline: 2px solid var(--blue); outline-offset: 1px; }
  .who select { position: absolute; inset: 0; opacity: 0; width: 100%; cursor: pointer; }
  .avatar { flex: none; width: 24px; height: 24px; border-radius: 7px; display: grid; place-items: center; font-weight: 650; font-size: 12px; color: #fff; background: #7a8bd6; }
  .name { font-weight: 620; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .chev { flex: none; color: var(--muted); }
  .chip { flex: none; display: inline-flex; align-items: center; gap: 5px; border-radius: 999px; padding: 1px 8px; font-size: 11px; font-weight: 600; line-height: 1.7; white-space: nowrap; }
  .chip.working { background: var(--working-bg); color: var(--working-text); }
  .chip.waiting { background: var(--waiting-bg); color: var(--waiting-text); }
  .chip.failed { background: var(--failed-bg); color: var(--failed); }
  .chip.unknown { background: var(--unknown-bg); color: var(--muted); }
  .icon-button { flex: none; width: 28px; height: 28px; display: grid; place-items: center; border: 0; border-radius: 7px; background: transparent; color: var(--muted); }
  .icon-button:hover { background: var(--sunken); color: var(--ink); }

  .spinner { width: 10px; height: 10px; border-radius: 50%; border: 1.5px solid currentColor; border-right-color: transparent; animation: spin 0.9s linear infinite; flex: none; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .dot { flex: none; width: 7px; height: 7px; border-radius: 50%; background: var(--muted); }
  .pulse { flex: none; width: 6px; height: 6px; border-radius: 50%; background: currentColor; animation: pulse 1.6s ease-in-out infinite; }
  @keyframes pulse { 50% { opacity: .35; } }
  .dot.live { background: var(--verified); }
  .dot.warn { background: #b25a16; }
  .dot.bad { background: var(--failed); }

  /* One line of context; it opens the application's details in place. */
  .context-toggle { display: flex; align-items: center; gap: 6px; width: calc(100% - 24px); margin: 0 12px; padding: 4px 6px; border: 0; border-radius: 7px; background: transparent; color: var(--muted); font-size: 12px; text-align: left; }
  .context-toggle:hover { background: var(--sunken); color: var(--ink); }
  .context-toggle .summary { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .context-toggle svg { flex: none; transition: transform var(--base); }
  .context-toggle[aria-expanded="true"] svg { transform: rotate(180deg); }
  .context { margin: 6px 12px 4px; padding: 4px 12px 10px; border: 1px solid var(--line); border-radius: 10px; background: var(--raised); max-height: 58vh; overflow: auto; }
  .context section { padding: 10px 0; border-bottom: 1px solid var(--line); }
  .context section:last-child { border-bottom: 0; padding-bottom: 2px; }
  .context h3 { margin: 0 0 4px; font-size: 11px; letter-spacing: .05em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
  .context p { margin: 2px 0; }
  .facts { display: grid; grid-template-columns: 88px 1fr; gap: 3px 10px; margin: 0; font-size: 12.5px; }
  .facts dt { color: var(--muted); }
  .facts dd { margin: 0; min-width: 0; overflow-wrap: anywhere; }
  .numbers { display: flex; flex-wrap: wrap; gap: 4px 16px; margin: 6px 0 2px; font-size: 12.5px; }
  .numbers b { font-weight: 650; font-variant-numeric: tabular-nums; }
  .bars { display: flex; align-items: flex-end; gap: 2px; height: 34px; margin-top: 8px; }
  .bars i { flex: 1; min-height: 2px; border-radius: 2px 2px 0 0; background: var(--working-line); }
  .bars i.error { background: var(--failed); opacity: .75; }
  .bars i.gap { background: repeating-linear-gradient(135deg, var(--line) 0 2px, transparent 2px 4px); height: 100% !important; opacity: .7; }
  .bars-axis { display: flex; justify-content: space-between; font-size: 10.5px; color: var(--muted); margin-top: 2px; }
  .problems { list-style: none; margin: 4px 0 0; padding: 0; font-size: 12.5px; }
  .problems li { display: flex; gap: 8px; padding: 3px 0; }
  .problems li > span:first-child { flex: 1; min-width: 0; overflow-wrap: anywhere; }
  .problems .n { color: var(--failed); font-variant-numeric: tabular-nums; font-weight: 600; }
  .context-foot { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 12px; padding-top: 10px; font-size: 12px; }

  /* The conversation with the main operator. */
  .thread { flex: 1; overflow-y: auto; padding: 8px 12px 16px; scroll-behavior: smooth; overscroll-behavior: contain; }
  .banner.read { position: sticky; top: 0; z-index: 2; box-shadow: 0 2px 8px rgb(28 52 110 / .08); }
  .banner { display: flex; gap: 8px; align-items: flex-start; margin: 6px 0 10px; padding: 8px 10px; border-radius: 8px; background: var(--unknown-bg); font-size: 12.5px; }
  .banner.failed { background: var(--failed-bg); }
  .banner p { margin: 0; flex: 1; }
  .earlier { display: block; margin: 4px 0 10px; font-size: 12px; color: var(--muted); text-align: center; }
  .turn { margin: 0 0 18px; }
  .ask { display: flex; flex-direction: column; align-items: flex-end; margin: 0 0 10px; }
  .ask p { margin: 0; max-width: 88%; padding: 7px 11px; border-radius: 12px 12px 4px 12px; background: var(--ask-bg); white-space: pre-wrap; overflow-wrap: anywhere; }
  .ask small { margin-top: 3px; font-size: 11px; color: var(--muted); }
  .ask.waiting p { background: transparent; border: 1px dashed var(--field-line); }
  .ask.failed p { background: var(--failed-bg); }
  .reply { min-width: 0; }
  .byline { display: flex; align-items: center; gap: 6px; margin-bottom: 4px; font-size: 11.5px; color: var(--muted); }
  .byline b { color: var(--ink); font-weight: 620; }
  .mark { width: 16px; height: 15px; flex: none; }
  .body { overflow-wrap: anywhere; }
  .body p { margin: 0 0 8px; }
  .body ul, .body ol { margin: 0 0 8px; padding-left: 20px; }
  .body li { margin: 2px 0; }
  .body code { font: 12px/1.5 var(--mono); padding: 0 4px; border-radius: 4px; background: var(--sunken); }
  .body pre { margin: 0 0 8px; padding: 8px 10px; border-radius: 8px; background: var(--sunken); overflow-x: auto; font: 12px/1.5 var(--mono); white-space: pre; }
  .body pre code { padding: 0; background: none; }
  .body h4 { margin: 10px 0 4px; font-size: 13.5px; }
  .body.folded { max-height: 15.5em; overflow: hidden; -webkit-mask-image: linear-gradient(#000 70%, transparent); mask-image: linear-gradient(#000 70%, transparent); }
  .text-button { border: 0; padding: 0; background: none; color: var(--blue); font-size: 12px; }
  .text-button:hover { text-decoration: underline; text-underline-offset: 3px; }
  .text-button.quiet { color: var(--muted); }
  .text-button.quiet:hover { color: var(--ink); }
  .actions { display: flex; flex-wrap: wrap; gap: 4px 14px; margin-top: 4px; }

  /* What a reply did: one line, opened on request. */
  .work { margin: 2px 0 8px; font-size: 12.5px; }
  .work > summary { display: inline-flex; align-items: center; gap: 6px; cursor: pointer; color: var(--muted); list-style: none; border-radius: 6px; padding: 1px 4px 1px 0; }
  .work > summary::-webkit-details-marker { display: none; }
  .work > summary:hover { color: var(--ink); }
  .work > summary svg { transition: transform var(--base); }
  .work[open] > summary svg { transform: rotate(90deg); }
  .steps { list-style: none; margin: 6px 0 2px; padding: 0 0 0 10px; border-left: 1px solid var(--line); }
  .steps > li { margin: 0 0 4px; }
  .said { margin: 6px 0; color: var(--ink); white-space: pre-wrap; overflow-wrap: anywhere; }
  .step > summary { display: flex; gap: 7px; align-items: baseline; cursor: pointer; list-style: none; }
  .step > summary::-webkit-details-marker { display: none; }
  .step .glyph { flex: none; width: 12px; text-align: center; color: var(--muted); font-size: 11px; }
  .step .glyph.failed { color: var(--failed); }
  .step .glyph.running { color: var(--working-text); }
  .step .what { flex: 1; min-width: 0; }
  .step .where { color: var(--muted); }
  .step pre { margin: 5px 0 6px 19px; padding: 7px 9px; border-radius: 7px; background: var(--sunken); font: 11.5px/1.5 var(--mono); white-space: pre-wrap; overflow-wrap: anywhere; max-height: 220px; overflow: auto; }
  .step .note { margin: 0 0 4px 19px; font-size: 11.5px; color: var(--muted); }

  /* Now: under the reply it belongs to. */
  .live { display: flex; align-items: center; gap: 7px; margin: 6px 0 2px; color: var(--working-text); font-size: 12.5px; }
  .live .says { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .live .since { flex: none; color: var(--muted); font-variant-numeric: tabular-nums; }
  .live.stale { color: var(--muted); }
  .tailing { margin: 4px 0 0 17px; padding: 6px 8px; border-radius: 7px; background: var(--sunken); font: 11px/1.5 var(--mono); color: var(--muted); white-space: pre-wrap; overflow-wrap: anywhere; max-height: 7.5em; overflow: hidden; }

  .card { margin: 8px 0; padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--raised); font-size: 12.5px; }
  .card.waiting { border-color: var(--waiting-line); background: var(--waiting-surface); }
  .card.failed { border-color: var(--failed-line); }
  .card h4 { display: flex; align-items: center; gap: 6px; margin: 0 0 4px; font-size: 12.5px; font-weight: 620; }
  .card p { margin: 3px 0; }
  .card code { font: 11.5px/1.5 var(--mono); padding: 0 3px; border-radius: 4px; background: var(--sunken); }
  .card code.command { display: block; margin: 6px 0; padding: 6px 8px; border-radius: 6px; background: var(--sunken); font: 11.5px/1.5 var(--mono); white-space: pre-wrap; overflow-wrap: anywhere; max-height: 6em; overflow: hidden; }
  .record { display: flex; gap: 8px; align-items: baseline; margin: 6px 0; padding: 7px 10px; border: 1px solid var(--line); border-radius: 10px; font-size: 12.5px; }
  .record .title { flex: 1; min-width: 0; }
  .record .meta { flex: none; color: var(--muted); font-size: 11.5px; }
  .tag { flex: none; font-size: 11px; font-weight: 600; }
  .tag.verified { color: var(--verified-text); }
  .tag.failed { color: var(--failed); }
  .tag.warning { color: var(--waiting-text); }
  .tag.info { color: var(--muted); }

  .empty { margin: 24px auto; max-width: 34ch; text-align: center; color: var(--muted); }
  .empty svg { width: 44px; height: 40px; }
  .empty h2 { margin: 8px 0 4px; font-size: 15px; color: var(--ink); font-weight: 620; }
  .empty p { margin: 0 0 12px; }
  .suggestions { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; }
  .suggestions button { border: 1px solid var(--line); border-radius: 999px; padding: 3px 10px; background: var(--surface); font-size: 12px; }
  .suggestions button:hover { background: var(--working-bg); color: var(--working-text); border-color: var(--working-line); }

  /* Ask, follow up. */
  .composer { padding: 8px 12px 10px; border-top: 1px solid var(--line); background: var(--surface); }
  .needs { margin: 0 0 8px; }
  .field { border: 1px solid var(--field-line); border-radius: 12px; background: var(--surface); padding: 8px 8px 6px 11px; transition: border-color var(--fast); }
  .field:focus-within { border-color: var(--blue); }
  .field:has(textarea:disabled) { background: var(--sunken); }
  .field textarea { display: block; width: 100%; min-height: 1.5em; border: 0; outline: 0; resize: none; background: transparent; line-height: 1.5; max-height: 9em; padding: 0; }
  .field textarea::placeholder { color: var(--muted); opacity: .8; }
  .field-row { display: flex; align-items: center; gap: 8px; margin-top: 4px; }
  .field-row .hint { flex: 1; min-width: 0; font-size: 11.5px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .send { flex: none; display: inline-flex; align-items: center; gap: 6px; height: 28px; padding: 0 11px; border: 0; border-radius: 8px; background: var(--blue); color: var(--blue-ink); font-size: 12.5px; font-weight: 560; box-shadow: inset 0 1px 0 rgb(255 255 255 / .18), 0 1px 2px rgb(28 52 110 / .2); }
  .send:hover { background: var(--blue-hover); }
  .send:disabled { opacity: .45; cursor: default; box-shadow: none; }
  .sending-note { margin: 6px 2px 0; font-size: 12px; }
  .sending-note.failed { color: var(--failed); }

  .popover { position: absolute; left: 12px; right: 12px; top: 42px; z-index: 6; padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); box-shadow: 0 8px 24px rgb(28 52 110 / .14); font-size: 12.5px; }
  .popover p { margin: 0 0 6px; }
  .menu { position: absolute; right: 12px; top: 42px; z-index: 5; min-width: 200px; padding: 4px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); box-shadow: 0 8px 24px rgb(28 52 110 / .14); }
  .menu button, .menu .item { display: block; width: 100%; padding: 6px 10px; border: 0; border-radius: 7px; background: none; text-align: left; font-size: 12.5px; }
  .menu button:hover, .menu button:focus-visible { background: var(--sunken); }
  .menu hr { border: 0; border-top: 1px solid var(--line); margin: 4px 2px; }
  .menu .item { color: var(--muted); font-size: 11.5px; cursor: default; }
  .address { display: flex; gap: 6px; margin-top: 6px; }
  .address input { flex: 1; min-width: 0; border: 1px solid var(--field-line); border-radius: 7px; padding: 3px 7px; background: var(--surface); font-size: 12px; }
  .address button { flex: none; border: 1px solid var(--field-line); border-radius: 7px; padding: 3px 9px; background: var(--surface); font-size: 12px; }

  .blank { margin: auto; padding: 24px; max-width: 38ch; text-align: center; }
  .blank h2 { font-size: 15px; margin: 8px 0 4px; }
  .blank .mark { width: 40px; height: 38px; }
  .blank p { margin: 0 0 12px; color: var(--muted); }
  .secondary { border: 1px solid var(--field-line); border-radius: 8px; padding: 4px 12px; background: var(--surface); font-size: 12.5px; }
  .secondary:hover { background: var(--sunken); }

  @media (prefers-reduced-motion: reduce) {
    .spinner { animation: none; border-right-color: currentColor; opacity: .7; }
    .pulse { animation: none; }
    .thread { scroll-behavior: auto; }
    * { transition: none !important; }
  }
</style>
</head>
<body>
<div id="app">
  <header class="top" id="top" hidden>
    <label class="who" title="Choose an application">
      <span class="avatar" id="avatar" aria-hidden="true"></span>
      <span class="name" id="name"></span>
      <svg class="chev" width="12" height="12" viewBox="0 0 12 12" aria-hidden="true"><path d="M3 4.5l3 3 3-3" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <select id="application" aria-label="Application"></select>
    </label>
    <span id="state" role="status" aria-live="polite"></span>
    <button class="icon-button" id="more" type="button" aria-label="More" aria-haspopup="menu" aria-expanded="false">
      <svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><circle cx="3.5" cy="8" r="1.3" fill="currentColor"/><circle cx="8" cy="8" r="1.3" fill="currentColor"/><circle cx="12.5" cy="8" r="1.3" fill="currentColor"/></svg>
    </button>
    <div class="menu" id="menu" role="menu" hidden>
      <button type="button" role="menuitem" id="menu-open">Open in Hallvi</button>
      <button type="button" role="menuitem" id="menu-refresh">Refresh</button>
      <hr />
      <span class="item">Panel <span id="ui-version">__HALLVI_UI_VERSION__</span></span>
      <button type="button" role="menuitem" id="menu-reload">Check for a panel update</button>
    </div>
  </header>
  <button class="context-toggle" id="context-toggle" type="button" aria-expanded="false" aria-controls="context" hidden>
    <span class="dot" id="condition-dot" aria-hidden="true"></span>
    <span class="summary" id="context-summary">Reading…</span>
    <svg width="12" height="12" viewBox="0 0 12 12" aria-hidden="true"><path d="M3 4.5l3 3 3-3" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
  </button>
  <div class="context" id="context" hidden></div>
  <div class="popover" id="link-help" role="dialog" aria-label="Hallvi's address" hidden></div>
  <main class="thread" id="thread" tabindex="-1" aria-label="Conversation with Hallvi"></main>
  <form class="composer" id="composer" hidden>
    <div id="needs" class="needs" hidden></div>
    <div class="field">
      <label class="sr" for="draft">Message to Hallvi</label>
      <textarea id="draft" rows="1" placeholder="Ask Hallvi…" autocomplete="off"></textarea>
      <div class="field-row">
        <span class="hint" id="hint"></span>
        <button class="send" id="send" type="submit" disabled>
          <span id="send-label">Send</span>
          <svg width="12" height="12" viewBox="0 0 12 12" aria-hidden="true"><path d="M6 10V2.5M2.8 5.5L6 2.3l3.2 3.2" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
      </div>
    </div>
    <p id="sending-note" class="sending-note" role="status" hidden></p>
  </form>
</div>
<template id="mascot"><svg class="mark" viewBox="4 1 30 34" aria-hidden="true"><path d="M13 9V4M23 9V4" stroke="#3e4a60" stroke-width="1.6"/><circle cx="13" cy="3" r="2" fill="#c5d2f7"/><circle cx="23" cy="3" r="2" fill="#c5d2f7"/><rect x="5" y="8" width="26" height="24" rx="5.5" fill="#7a8bd6"/><rect x="7.5" y="11" width="21" height="11" rx="3.5" fill="#192338"/><rect x="13" y="14" width="2.4" height="4.6" rx="1.2" fill="#edf3ff"/><rect x="20.6" y="14" width="2.4" height="4.6" rx="1.2" fill="#edf3ff"/><path d="M12 26v3M15 26v3M18 26v3M21 26v3M24 26v3" stroke="#5b6bb5" stroke-width="1.3" stroke-linecap="round"/></svg></template>
<script type="module">
const $ = (id) => document.getElementById(id);
const VERSION = "0.2.0";
const PALETTE = ["#7a8bd6", "#5f9e8f", "#c07a5a", "#9a7ac4", "#5b8fc4", "#b58a3c"];

// ---------------------------------------------------------------- host bridge
let rpcId = 0;
const pending = new Map();
let host = { ready: false, canMessage: true };
const post = (message) => window.parent.postMessage({ jsonrpc: "2.0", ...message }, "*");
const request = (method, params, timeoutMs = 45_000) => new Promise((resolve, reject) => {
  const id = ++rpcId;

    const item = pending.get(message.id); pending.delete(message.id); clearTimeout(item.timer);

    applyHostContext(message.params);

// ---------------------------------------------------------------- words
const plural = (n, one, many) => `${n} ${n === 1 ? one : many}`;

  if (seconds < 3600) return `${Math.round(seconds / 60)} min ago`;
  if (seconds < 86_400) return `${Math.round(seconds / 3600)} h ago`;

}

/** "3 commands and 2 records", as the page says it. */
const KINDS = [
  ["read", /^(read|read_file|cat|ls|list_directory)$/, "file read", "file reads"],
  ["search", /^(grep|find|glob|search_information)$/, "search", "searches"],
  ["ran", /^(bash|server_bash|powershell)$/, "command", "commands"],
  ["wrote", /^(write|edit|write_file|edit_file|multi_edit)$/, "file change", "file changes"],
  ["saved", /^(save_information|retire_information)$/, "record", "records"],
  ["asked", /^request_approval$/, "approval", "approvals"],
];
function summarise(steps) {
  const tools = steps.filter((step) => step.kind === "tool");
  const counts = KINDS.map(([kind, test, one, many]) => ({ kind, one, many, n: tools.filter((step) => test.test(step.tool)).length })).filter((entry) => entry.n);
  const other = tools.length - counts.reduce((sum, entry) => sum + entry.n, 0);
  if (other) counts.push({ one: "call", many: "calls", n: other });
  if (!counts.length) return "";
  if (counts.length > 3) return plural(tools.length, "call", "calls");
  const said = counts.map((entry) => plural(entry.n, entry.one, entry.many));
  return said.length === 1 ? said[0] : `${said.slice(0, -1).join(", ")} and ${said.at(-1)}`;
}
const where = (step) => [step.place ? lower(step.place) : null, step.host].filter(Boolean).join(" ");

/** The most specific true thing about a reply in flight, from its records. */

  const steps = reply.steps.filter((step) => step.kind === "tool");
  const asking = steps.find((step) => step.status === "awaiting-approval" || (step.tool === "request_approval" && step.status === "running"));
  if (asking) return { says: "Waiting for your approval", at: asking.startedAt, waiting: true, step: asking };
  const running = steps.findLast((step) => step.status === "running");
  if (running) {
    const place = where(running);
    return { says: `${running.title}${place ? ` · ${place}` : ""}`, at: running.startedAt, step: running };
  }
  return { says: reply.body ? "Writing the reply" : "Thinking", at: reply.startedAt };
}

// ---------------------------------------------------------------- markdown, safely
function inline(text, into) {
  const pattern = /(`[^`]+`)|(\*\*[^*]+\*\*)|(\[[^\]]+\]\((https?:\/\/[^\s)]+)\))|(https?:\/\/[^\s<>()]+[^\s<>().,;:!?'"])|(\*[^*\s][^*]*\*)/g;
  let last = 0;
  for (const match of text.matchAll(pattern)) {
    if (match.index > last) into.append(text.slice(last, match.index));
    const [whole] = match;
    if (match[1]) into.append(el("code", {}, whole.slice(1, -1)));
    else if (match[2]) into.append(el("strong", {}, whole.slice(2, -2)));
    else if (match[3]) into.append(link(whole.slice(1, whole.indexOf("](")), match[4]));
    else if (match[5]) into.append(link(whole, whole));
    else into.append(el("em", {}, whole.slice(1, -1)));
    last = match.index + whole.length;
  }
  if (last < text.length) into.append(text.slice(last));
  return into;
}
function markdown(source) {
  const root = el("div", { class: "body" });
  const lines = source.replace(/\r/g, "").split("\n");
  let list = null;
  let paragraph = [];
  const flush = () => { if (paragraph.length) { root.append(inline(paragraph.join(" "), el("p"))); paragraph = []; } };
  for (let i = 0; i < lines.length; i++) {
    const line = lines[i];
    if (/^```/.test(line.trim())) {
      flush(); list = null;
      const code = [];
      for (i++; i < lines.length && !/^```/.test(lines[i].trim()); i++) code.push(lines[i]);
      root.append(el("pre", {}, el("code", {}, code.join("\n"))));
      continue;
    }
    const heading = /^#{1,6}\s+(.*)$/.exec(line);
    const item = /^\s*(?:[-*•]|(\d+)[.)])\s+(.*)$/.exec(line);
    if (heading) { flush(); list = null; root.append(inline(heading[1], el("h4"))); }
    else if (item) {
      flush();
      const kind = item[1] ? "ol" : "ul";
      if (!list || list.tagName.toLowerCase() !== kind) { list = el(kind); root.append(list); }
      list.append(inline(item[2], el("li")));
    } else if (!line.trim()) { flush(); list = null; }
    else if (list && /^\s{2,}\S/.test(line)) list.lastChild.append(" ", inline(line.trim(), document.createDocumentFragment()));
    else { list = null; paragraph.push(line.trim()); }
  }
  flush();
  return root;
}

// ---------------------------------------------------------------- DOM helpers
function el(tag, attributes = {}, ...children) {
  const node = document.createElement(tag);
  for (const [key, value] of Object.entries(attributes)) {
    if (value == null || value === false) continue;
    if (key.startsWith("on")) node.addEventListener(key.slice(2), value);
    else if (key === "class") node.className = value;
    else node.setAttribute(key, value === true ? "" : value);
  }
  for (const child of children.flat()) if (child != null && child !== false) node.append(child);
  return node;
}
const mascot = () => $("mascot").content.firstElementChild.cloneNode(true);
function link(label, href) {

}

/** Open an address through the host; HTTP stays copyable, since hosts may ignore it. */

function showAddress(address, help) {

/** Hand a reply to Codex's own composer, where the code is. */

// ---------------------------------------------------------------- reading
function setApplications(list) {
  state.apps = list;
  if (!list.some((item) => item.id === state.selected)) state.selected = list[0]?.id ?? null;
  renderIdentity();
  if (state.selected) select(state.selected, { keepDraft: true });
  else renderBlank("No applications yet", "Add an application in Hallvi, then refresh this panel.", [["Open Hallvi", () => void openAddress(pageOrigin())], ["Refresh", start]]);
}
function pageOrigin() {
  const page = state.apps[0]?.page;
  try { return new URL(page).origin; } catch { return "http://127.0.0.1:4747"; }
}
async function start() {
  renderBlank(null, "Connecting to Hallvi…");
  try {
    const data = await call("hallvi_apps");
    setApplications(data.applications ?? []);
  } catch (error) {
    renderBlank("Can't reach Hallvi", unreachable(error), [["Try again", start]]);
  }
}
function unreachable(error) {
  if (error.code === "host-timeout") return "The connection to the Hallvi plugin did not answer. For a remote Hallvi, check its SSH connection, then try again.";
  if (error.code === "worker-unavailable") return "Hallvi is running but its worker is not, so the conversation cannot be read. Start or restart Hallvi, then try again.";
  if (error.code === "unreachable") return `${error.message} Hallvi may be stopped, or this plugin points at another address.`;

}
function select(id, { keepDraft = false } = {}) {

  store.set("application", id);
  state.context = null; state.contextError = null; state.conversation = null; state.conversationError = null;
  state.failures = 0; state.open.clear(); state.unfolded.clear();

  renderIdentity();
  renderThread();
  renderComposer();

}
async function readContext() {
  const mine = generation;
  const id = state.selected;
  try {
    const data = await call("hallvi_inspect", { application_id: id });
    if (mine !== generation) return;
    state.context = data; state.contextAt = new Date().toISOString(); state.contextError = null;
  } catch (error) {

    state.contextError = error;

/** Read the conversation now, then again at a pace that suits what it is doing. */
async function follow(now = false) {

  if (!now && document.hidden) { pollTimer = setTimeout(() => follow(), 4000); return; }
  const mine = generation;
  const previous = state.conversation;
  try {
    const data = await call("hallvi_conversation", { application_id: state.selected, turns: 5, known: previous?.revision });
    if (mine !== generation) return;
    const recovered = Boolean(state.conversationError);
    state.readAt = data.readAt; state.failures = 0; state.conversationError = null;
    if (!data.unchanged) {
      const was = previous?.status;
      state.conversation = data;
      settleSend();
      renderThread();
      renderIdentity();
      renderComposer();
      if (was && was !== data.status) void readContext();
      describeToModel();
    } else if (recovered) { renderThread(); renderIdentity(); renderComposer(); }
  } catch (error) {
    if (mine !== generation) return;
    state.failures++;
    state.conversationError = error;
    renderThread(); renderIdentity(); renderComposer();
  }
  if (mine !== generation) return;

/** What the conversation in Codex should know about this panel. */
function describeToModel() {
  const a = app(); const c = state.conversation;
  if (!a || !c) return;
  const last = c.turns?.at(-1);
  const reply = last?.reply;
  const now = reply && ["running", "waiting"].includes(reply.status) ? doing(reply, c.worker?.alive).says : null;
  void shareContext([
    `The Hallvi panel shows application "${a.name}" (application_id ${a.id}) on the Hallvi controller ${c.controller ?? state.context?.controller ?? ""}.`,
    `Its main operator is ${c.status ?? "unknown (worker unavailable)"}${now ? `: ${now}` : ""}.`,
    last?.request ? `Latest request: ${last.request.body.slice(0, 300)}` : "",
    reply?.body ? `Latest reply (${reply.status}): ${reply.body.slice(0, 900)}` : "",
    "Use hallvi_conversation for details and hallvi_exec with this application_id to ask for work. Approvals stay in Hallvi.",
  ].filter(Boolean).join("\n"));
}

// ---------------------------------------------------------------- sending
function restoreDraft() {
  const saved = store.get(`draft:${state.selected}`);
  $("draft").value = saved?.text ?? "";
  state.send = saved?.key && saved?.unknown ? { key: saved.key, text: saved.text, state: "unknown" } : state.send?.state === "accepted" ? state.send : null;
  autosize();
}
function saveDraft() {
  const text = $("draft").value;
  const keep = state.send?.state === "unknown" && state.send.text === text ? { text, key: state.send.key, unknown: true } : text ? { text } : null;
  store.set(`draft:${state.selected}`, keep);
}
async function send(event) {
  event?.preventDefault();
  const text = $("draft").value.trim();
  if (!text || !canSend().ok || state.send?.state === "sending") return;
  // The same key for the same words: a resend after a lost answer never runs twice.
  const key = state.send?.state === "unknown" && state.send.text === text ? state.send.key : crypto.randomUUID();
  const id = state.selected;
  state.send = { key, text, state: "sending" };
  renderComposer(); renderThread();
  let result = null;
  try {
    result = await call("hallvi_exec", { application_id: id, message: text, request_key: key });
  } catch (error) {
    result = error.data ?? { accepted: error.code === "host-timeout" ? null : false, error: { message: error.message } };
  }
  if (id !== state.selected) return;
  if (result.accepted === true) {
    state.send = { key, text, state: "accepted" };
    state.sent.add(key);
    $("draft").value = ""; store.set(`draft:${id}`, null); autosize();
  } else if (result.accepted === null) {
    state.send = { key, text, state: "unknown" };
    store.set(`draft:${id}`, { text, key, unknown: true });
  } else {
    state.send = { key: null, text, state: "refused", message: result.error?.message ?? "Hallvi did not take this message." };
  }
  renderComposer(); renderThread();
  void follow(true);

}

  const key = state.send?.key;
  if (!key || !["accepted", "unknown"].includes(state.send.state)) return;
  const seen = state.conversation?.turns?.some((turn) => turn.request?.requestKey === key);
  if (!seen) return;
  if (state.send.state === "unknown") { $("draft").value = ""; store.set(`draft:${state.selected}`, null); autosize(); }
  state.sent.add(key);
  state.send = null;
}

  const a = app(); const c = state.conversation; const context = state.context;
  if (!a) return { ok: false };
  if (!a.mainChatId) return { ok: false, why: "This application has no main conversation yet. Finish setting it up in Hallvi." };
  if (state.conversationError && !c) return { ok: false, why: "Can't reach Hallvi right now. Your draft is kept." };
  if (c && !c.worker?.alive) return { ok: false, why: "Hallvi's worker isn't running, so nothing can be sent now." };
  if (c?.status === "interrupted" || context?.main?.status === "interrupted") return { ok: false, why: "Work was interrupted. Choose Continue or Stop in Hallvi first." };
  return { ok: true };

// ---------------------------------------------------------------- rendering: identity and context
function renderIdentity() {
  const a = app();
  $("top").hidden = !a;
  $("context-toggle").hidden = !a;
  if (!a) return;
  const select = $("application");
  if (select.options.length !== state.apps.length || [...select.options].some((option, i) => option.value !== state.apps[i].id)) {
    select.replaceChildren(...state.apps.map((item) => el("option", { value: item.id }, item.name)));
  }
  select.value = a.id;
  select.disabled = state.apps.length < 2;
  $("name").textContent = a.name;
  const index = Math.abs([...a.id].reduce((sum, ch) => sum + ch.charCodeAt(0), 0)) % PALETTE.length;
  $("avatar").textContent = a.name.trim().charAt(0).toUpperCase();
  $("avatar").style.background = PALETTE[index];

  // The operator's state, only when there is something to say.
  const c = state.conversation;
  const attention = state.context?.attention ?? [];
  let chip = null;
  if (state.conversationError && state.failures > 1) chip = ["unknown", "Can't reach Hallvi"];
  else if (c && !c.worker?.alive) chip = ["unknown", "Worker stopped"];
  else if (c?.status === "awaiting-approval" || waitingOnApproval(c)) chip = ["waiting", "Needs your approval"];
  else if (c?.status === "interrupted") chip = ["waiting", "Interrupted"];
  else if (attention.some((item) => item.kind === "input")) chip = ["waiting", "Needs you"];
  else if (c?.status === "working" || state.send?.state === "sending") chip = ["working", "Working"];
  $("state").replaceChildren(chip ? el("span", { class: `chip ${chip[0]}` }, chip[0] === "working" ? el("span", { class: "pulse", "aria-hidden": "true" }) : null, chip[1]) : "");

  // The one line of context under the name.
  const context = state.context;
  const parts = [];
  const tone = context?.condition?.tone ?? a.condition?.tone;
  $("condition-dot").className = `dot ${tone ?? ""}`;
  parts.push(context?.condition?.text ?? a.condition?.text ?? "Condition not read yet");
  const traffic = context?.traffic;
  if (traffic && !traffic.unavailable) {
    if (["live", "catching-up"].includes(traffic.state) && traffic.totals) {
      parts.push(`${count(traffic.totals.views)} ${traffic.totals.views === 1 ? "view" : "views"} in 24 h`);
      if (traffic.totals.errors) parts.push(`${plural(traffic.totals.errors, "error", "errors")}`);
    }
  }
  $("context-summary").textContent = parts.join(" · ");
  $("context-toggle").setAttribute("aria-expanded", String(state.contextOpen));
  $("context-toggle").setAttribute("aria-label", `${parts.join(", ")}. ${state.contextOpen ? "Hide" : "Show"} application details`);
}

/** An approval the latest reply is waiting on, whatever the lane's own status says. */
function waitingOnApproval(c) {
  const reply = c?.turns?.at(-1)?.reply;
  return Boolean(reply && ["running", "waiting"].includes(reply.status) && reply.steps.some((step) => step.status === "awaiting-approval" || (step.tool === "request_approval" && step.status === "running")));
}
function renderContext() {
  const box = $("context");
  box.hidden = !state.contextOpen;
  if (!state.contextOpen) return;
  const a = app(); const context = state.context;
  if (!context) {
    box.replaceChildren(el("section", {}, el("p", { class: "muted" }, state.contextError ? `Details unavailable: ${state.contextError.message}` : "Reading details…")));
    return;
  }
  const application = context.application ?? {};
  const deployment = context.deployment;
  const facts = el("dl", { class: "facts" });
  const fact = (label, value) => { if (value) facts.append(el("dt", {}, label), el("dd", {}, value)); };
  if (a.address) fact("Address", link(a.address.replace(/^https?:\/\//, ""), a.address));
  if (context.condition?.nextStep) fact("Next", context.condition.nextStep);

  if (window.parent === window) throw new Error("Open this panel through the Hallvi plugin in Codex or ChatGPT.");
  const init = await request("ui/initialize", { appInfo: { name: "hallvi", version: VERSION }, appCapabilities: {}, protocolVersion: "2026-01-26" }, 15_000);
  applyHostContext(init?.hostContext);
  post({ method: "ui/notifications/initialized", params: {} });
  host.ready = true;
  await start();
} catch (error) {
  renderBlank("Panel connection unavailable", error.message || "This panel needs an MCP Apps host.");
}
</script>
</body>
</html>
